name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --frozen
      - name: Offline match matches the committed counts
        run: uv run python -m unittest tests.test_offline_match -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Explorer loader
        run: node explorer/test/normalize.test.js
