name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install
        run: uv sync --frozen
      - name: Offline pipeline and reviewed programme guards
        run: uv run python -m unittest discover -s tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Explorer loader
        run: node explorer/test/normalize.test.js
      - name: Qobuz catalogue cache and error handling (mocked)
        run: uv run --with 'requests>=2.32,<3' python -m unittest discover -s scripts/test -v
      - name: Verify portable Spotify follow-up evidence
        run: uv run python scripts/spotify_followup_verify.py
