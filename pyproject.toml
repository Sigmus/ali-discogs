[project]
name = "ali-discogs"
version = "0.1.0"
description = "Match Ali's Discogs collection (user ajozi) against Spotify and publish a static explorer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.6",
  "unidecode>=1.3",
]

[project.scripts]
ali-discogs = "ali_discogs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ali_discogs"]
