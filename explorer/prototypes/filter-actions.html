<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filter action options · ajozi vinyl</title><link rel="stylesheet" href="../style.css"><style>
main{max-width:1300px;margin:auto;padding:24px 16px}h1{font-size:22px}.intro{color:var(--c-muted);max-width:700px}.options{display:grid;gap:28px;margin-top:24px}.option{border-bottom:1px solid var(--c-border);padding-bottom:26px}.option h2{margin:0 0 6px}.description{color:var(--c-muted);font-size:13px}.demo{padding:18px;background:color-mix(in srgb,var(--c-text) 2%,var(--c-bg));display:grid;grid-template-columns:1fr 1fr auto;align-items:end;gap:12px}.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--c-muted)}.fake{height:28px;border:1px solid var(--c-border);border-radius:4px;padding:3px 8px}.actions{display:flex;gap:6px;height:28px}.icon{position:relative;width:30px;height:28px;padding:5px;display:grid;place-items:center;color:var(--c-muted)}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon:hover,.icon:focus-visible{color:var(--c-text)}.icon[aria-pressed=true]{color:var(--c-accent);background:color-mix(in srgb,var(--c-accent) 12%,transparent)}.bare .icon{border-color:transparent;background:transparent}.group{gap:0;border:1px solid var(--c-border);border-radius:4px}.group .icon{border:0;border-radius:0;height:26px}.group .icon+button{border-left:1px solid var(--c-border)}.tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--c-text);color:var(--c-bg);padding:4px 7px;border-radius:4px;font-size:11px;white-space:nowrap;pointer-events:none;opacity:0;z-index:5}.icon:hover .tip,.icon:focus-visible .tip{opacity:1}.status{font-size:12px;color:var(--c-muted);margin-top:8px;min-height:18px}.top{display:flex;justify-content:space-between;gap:12px} @media(max-width:600px){.demo{grid-template-columns:1fr}.actions{justify-self:start}.tip{left:0;transform:none}}
</style></head><body><main><div class="top"><h1>Clear + Pin beside Search</h1><button id="theme-demo" class="icon" aria-label="Switch colour theme" title="Switch colour theme"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span class="tip" role="tooltip">Switch colour theme</span></button></div><p class="intro">Three treatments in the same place, directly after Search. Hover or keyboard-focus any icon for its tooltip. Try Clear and Pin independently in each option.</p><div class="options" id="options"></div></main><script>
const pin='<path d="M8 3h8M9 3v6l-3 4v2h12v-2l-3-4V3M12 15v6"/>';
const clear='<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/>';
const reset='<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>';
const variants=[['A','Quiet outline buttons','Separate compact buttons; familiar reset arrow for Clear.','',reset],['B','Unboxed icons','The lightest treatment, with an eraser for clearing filters.','bare','<path d="m14 3 7 7-10 11H6l-4-4L14 3ZM7 12l7 7M11 21h11"/>'],['C','One grouped control','Clear and Pin share one outlined group; distinct actions with a divider.','group',reset]];
function button(action,path,label){return `<button type="button" class="icon" data-action="${action}" aria-label="${label}" title="${label}" ${action==='pin'?'aria-pressed="false"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg><span class="tip" role="tooltip">${label}</span></button>`;}
document.querySelector('#options').innerHTML=variants.map(([id,title,desc,cls,shape])=>`<section class="option"><h2>${id} · ${title}</h2><p class="description">${desc}</p><div class="demo"><label class="field">Decade<select><option>1960s</option><option>Any</option></select></label><label class="field">Search<input value="Beethoven" aria-label="Search in option ${id}"></label><div class="actions ${cls}">${button('clear',shape,'Clear all filters')}${button('pin',pin,'Pin filters while scrolling')}</div></div><p class="status" aria-live="polite">Filters active · Not pinned</p></section>`).join('');
document.querySelector('#options').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const section=b.closest('.option');if(b.dataset.action==='clear'){section.querySelector('input').value='';section.querySelector('select').value='Any';}else{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.title=on?'Unpin filters':'Pin filters while scrolling';b.setAttribute('aria-label',b.title);b.querySelector('.tip').textContent=b.title;}section.querySelector('.status').textContent=(section.querySelector('input').value?'Filters active':'Filters cleared')+' · '+(section.querySelector('[data-action=pin]').getAttribute('aria-pressed')==='true'?'Pinned':'Not pinned');};document.querySelector('#theme-demo').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
</script></body></html>
