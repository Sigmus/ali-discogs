<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Release detail options · ajozi vinyl</title><link rel="stylesheet" href="../style.css"><style>
main{padding:24px 16px;max-width:1400px;margin:auto}.chooser{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chooser button[aria-pressed=true]{color:var(--c-accent);border-color:var(--c-accent)}.intro{color:var(--c-muted);max-width:850px}.release{margin-top:32px}.hero{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px}.cover{width:100%;border-radius:3px}.title{font-size:25px;line-height:1.3;margin:0 0 20px;overflow-wrap:anywhere}.artists{color:var(--c-muted)}dl{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 16px;margin:0}dt{color:var(--c-muted)}dd{margin:0;overflow-wrap:anywhere}.body{margin-top:28px}.body h2,.services h2{font-size:16px;border-bottom:1px solid var(--c-border);padding-bottom:10px;margin:24px 0 12px}.tracks{width:100%;border-collapse:collapse}.tracks td{padding:10px 8px;border-bottom:1px solid var(--c-border)}.tracks td:first-child{width:65px;color:var(--c-muted)}.tracks .heading{background:color-mix(in srgb,var(--c-text) 4%,transparent);font-weight:600}.hint{font-size:12px;color:var(--c-muted);margin:10px 0}.services{display:grid;grid-template-columns:1fr 1fr;gap:24px}.service p{margin:8px 0}.service .status{color:var(--c-accent)}.release.b .hero{grid-template-columns:180px minmax(0,1fr)}.release.b .columns{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:40px}.release.b .services{display:block;border-left:1px solid var(--c-border);padding-left:24px}.release.c{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px}.release.c .hero{display:block}.release.c .title{margin-top:0}.release.c dl{grid-template-columns:70px minmax(0,1fr);font-size:13px;margin-top:20px}.release.c .body{margin-top:0}.source{display:inline-block;margin-top:12px;font-size:12px}@media(max-width:700px){.hero,.release.b .hero,.release.c,.release.b .columns{display:block}.cover{max-width:200px;margin-bottom:20px}.services{grid-template-columns:1fr}.release.b .services{border:0;padding:0}.title{font-size:22px}}
</style></head><body><header class="app-header"><span class="brand">ajozi vinyl <small class="quiet">/ Detail options</small></span><button id="theme">Light / dark</button></header><main><h1>Release information</h1><p class="intro">Three arrangements of the same saved release. Discogs-style facts, tracklist and credits; our existing colours and typography. Switch options to compare at full width.</p><nav class="chooser" aria-label="Detail layout"><button data-layout="a" aria-pressed="true">A · Discogs structure</button><button data-layout="b" aria-pressed="false">B · Evidence alongside</button><button data-layout="c" aria-pressed="false">C · Catalogue sidebar</button></nav><p class="intro" id="description"></p><div id="preview" aria-live="polite">Loading release…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let row,qb,mode='a';
const descriptions={a:'Closest to Discogs: cover and labelled facts, then tracklist, credits and streaming evidence.',b:'Release and tracklist on the left; Spotify and Qobuz evidence in a dedicated right column.',c:'Cover and catalogue facts in a narrow left column; title, tracklist, credits and services on the right.'};
function facts(){const fields=[['Label',row.labels.map(l=>`${l.name} — ${l.catno}`).join(' · ')],['Format',row.formats.map(f=>[f.name,...f.descriptions||[]].join(', ')).join(' · ')],['Country',row.country],['Released',row.released||row.year],['Genre',(row.genres||[]).join(', ')],['Style',(row.styles||[]).join(', ')]];return '<dl>'+fields.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v||'—')}</dd>`).join('')+'</dl>';}
function title(){return `<h1 class="title"><span class="artists">${esc(row.artists.join(', '))}</span> — ${esc(row.title)}</h1>`;}
function tracks(){return `<h2>Tracklist</h2><table class="tracks"><tbody>${row.tracklist.map(t=>`<tr class="${t.type==='index'?'heading':''}"><td>${esc(t.position||'—')}</td><td>${esc(t.title)}</td><td>${esc(t.duration)}</td></tr>`).join('')}</tbody></table><p class="hint">This saved release contains only the work heading. Discogs shows movement detail that is not present in our published data; this prototype does not invent it.</p><h2>Credits</h2><dl><dt>Composer</dt><dd>${esc(row.composers.join(', '))}</dd><dt>Conductor</dt><dd>${esc(row.conductor)}</dd><dt>Ensemble</dt><dd>${esc(row.ensembles.join(', '))}</dd><dt>Performers</dt><dd>${esc(row.performers.join(', '))}</dd></dl><p class="hint">Saved credit categories shown as supplied. Instrument roles and release notes are not available in this data.</p>`;}
function service(name,s){return `<section class="service"><h2>${name}</h2><p class="status">${esc(s.status)}${s.confidence!=null?' ('+Math.round(s.confidence*100)+'%)':''}</p>${s.album?`<p>${esc(s.album.name)}</p><a href="${esc(s.album.url)}" target="_blank" rel="noopener">Open on ${name} ↗</a>`:''}<p class="hint">${name==='Spotify'?'Legacy album-level similarity; full recording identity not verified.':esc((s.reasons||['No accepted evidence yet.']).join(' '))}</p></section>`;}
function render(){document.querySelector('#description').textContent=descriptions[mode];const cover=`<img class="cover" src="${esc(row.cover_image)}" alt="${esc(row.title)} cover"><a class="source" href="${esc(row.discogs_url)}" target="_blank" rel="noopener">View release on Discogs ↗</a>`;const services=`<div class="services">${service('Spotify',row.spotify)}${service('Qobuz',qb)}</div>`;document.querySelector('#preview').innerHTML=mode==='c'?`<article class="release c"><aside class="hero">${cover}${facts()}</aside><div class="body">${title()}${tracks()}${services}</div></article>`:`<article class="release ${mode}"><div class="hero"><div>${cover}</div><div>${title()}${facts()}</div></div><div class="columns"><div class="body">${tracks()}</div>${services}</div></article>`;document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===mode)));}
document.querySelector('.chooser').onclick=e=>{if(e.target.dataset.layout){mode=e.target.dataset.layout;render();}};document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
Promise.all([fetch('../data/collection_matches.json').then(r=>r.json()),fetch('../data/qobuz_matches.json').then(r=>r.json())]).then(([rows,q])=>{row=rows.find(r=>r.discogs_id===7946604);qb=(q.results||q.releases||{})['7946604']||{status:'unchecked'};render();}).catch(e=>document.querySelector('#preview').textContent='Could not load saved release: '+e.message);
</script></body></html>
