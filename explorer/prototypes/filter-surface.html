<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filter background options · ajozi vinyl</title><link rel="stylesheet" href="../style.css"><style>
body{height:100vh;display:flex;flex-direction:column}.controls{padding:18px 16px;border-bottom:1px solid var(--c-border)}h1{font-size:19px;margin:0 0 6px}.choices{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}.choices button{font-size:13px}.choices button[aria-pressed=true]{color:var(--c-accent);border-color:var(--c-accent)}p{margin:0;color:var(--c-muted);font-size:13px}.top{display:flex;justify-content:space-between;gap:16px}iframe{width:100%;flex:1;min-height:500px;border:0;background:var(--c-bg)}
</style></head><body><div class="controls"><div class="top"><div><h1>Filter background options</h1><p>Live collection preview — try the filters and compare the treatments.</p></div><button id="preview-theme">Light / dark</button></div><nav class="choices" aria-label="Filter background"><button data-option="a" aria-pressed="true">A · Soft raised band</button><button data-option="b" aria-pressed="false">B · Dark inset band</button><button data-option="c" aria-pressed="false">C · Subtle violet tint</button><button data-option="d" aria-pressed="false">D · Outlined panel</button></nav><p id="description"></p></div><iframe id="live" title="Collection with selected filter treatment" src="../?v=filter-surface"></iframe><script>
let selected='a',theme='dark';const frame=document.querySelector('#live');
const descriptions={a:'Slightly lighter than the collection, with a quiet bottom border. Recommended: clear separation with minimal decoration.',b:'Darker than the collection, echoing the header, with a bottom border.',c:'A restrained violet wash with a muted violet bottom border.',d:'An inset panel with a complete border and gently rounded corners.'};
const base=`.filters{padding:18px 16px 20px;margin:0 -16px 18px;box-sizing:border-box}.filters input,.filters .multi-trigger{background:var(--c-bg)}.page-shell{padding-top:0}`;
const styles={a:'.filters{background:color-mix(in srgb,var(--c-text) 4%,var(--c-bg));border-bottom:1px solid var(--c-border)}',b:'.filters{background:var(--c-sidebar);border-bottom:1px solid var(--c-border)}',c:'.filters{background:color-mix(in srgb,var(--c-accent) 6%,var(--c-bg));border-bottom:1px solid color-mix(in srgb,var(--c-accent) 28%,var(--c-border))}',d:'.filters{margin:16px 0 18px;background:color-mix(in srgb,var(--c-text) 3%,var(--c-bg));border:1px solid var(--c-border);border-radius:6px}'};
function apply(){const doc=frame.contentDocument;if(!doc)return;let style=doc.querySelector('#surface-prototype');if(!style){style=doc.createElement('style');style.id='surface-prototype';doc.head.append(style);}style.textContent=base+styles[selected];doc.documentElement.dataset.theme=theme;document.documentElement.dataset.theme=theme;document.querySelector('#description').textContent=descriptions[selected];document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===selected)));}
frame.onload=apply;document.querySelector('.choices').onclick=e=>{if(e.target.dataset.option){selected=e.target.dataset.option;apply();}};document.querySelector('#preview-theme').onclick=()=>{theme=theme==='dark'?'light':'dark';apply();};apply();
</script></body></html>
