<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filter icon choices</title><link rel="stylesheet" href="../style.css"><style>main{max-width:1050px;margin:auto;padding:28px 20px}h1{font-size:22px}p{color:var(--c-muted)}.choices{display:flex;gap:24px;flex-wrap:wrap;margin:20px 0 36px}.choice{display:flex;align-items:center;gap:10px;font-size:13px}.icon{position:relative;display:grid;place-items:center;width:30px;height:28px;padding:5px;color:var(--c-muted)}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.icon[aria-pressed=true]{color:var(--c-accent);border-color:var(--c-accent)}.tip{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--c-text);color:var(--c-bg);padding:4px 7px;border-radius:4px;font-size:11px;white-space:nowrap;opacity:0;pointer-events:none}.icon:hover .tip,.icon:focus-visible .tip{opacity:1}.preview{display:flex;gap:6px;align-items:end;background:color-mix(in srgb,var(--c-text) 2%,var(--c-bg));padding:20px;border-bottom:1px solid var(--c-border)}label{display:flex;flex-direction:column;gap:4px;color:var(--c-muted);font-size:12px;margin-right:8px;width:300px}input{height:28px}h2{font-size:16px}</style></head><body><main><h1>Choose the icons for option A</h1><p>Same compact outlined buttons. Choose one Clear icon and one Pin icon to preview the pair.</p><h2>Clear filters</h2><div class="choices" id="clear-options"></div><h2>Pin filters</h2><div class="choices" id="pin-options"></div><h2>Selected pair</h2><div class="preview"><label>Search<input placeholder="Title, composer, performer"></label><span id="pair" style="display:flex;gap:6px"></span></div><p id="selection" style="margin-top:12px"></p></main><script>
const clear=[['1','Reset arrow','<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>'],['2','Eraser','<path d="m14 3 7 7-10 11H6l-4-4L14 3ZM7 12l7 7M11 21h11"/>'],['3','Filter with cross','<path d="M3 4h18l-7 8v7l-4 2v-9L3 4ZM17 16l5 5m0-5-5 5"/>'],['4','Simple cross','<path d="m6 6 12 12M18 6 6 18"/>']];
const pins=[['1','Upright pin','<path d="M8 3h8M9 3v6l-3 4v2h12v-2l-3-4V3M12 15v6"/>'],['2','Angled pin','<g transform="rotate(35 12 12)"><path d="M8 3h8M9 3v6l-3 4v2h12v-2l-3-4V3M12 15v6"/></g>'],['3','Map pin','<path d="M19 9c0 5-7 12-7 12S5 14 5 9a7 7 0 1 1 14 0Z"/><circle cx="12" cy="9" r="2"/>'],['4','Lock position','<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>']];
let selected={clear:'1',pin:'1'};function button(kind,item,preview=false){const [id,name,path]=item,label=kind==='clear'?'Clear all filters':'Pin filters while scrolling';return `<button class="icon" type="button" title="${label}: ${name}" aria-label="${label}: ${name}" ${preview?'':`data-kind="${kind}" data-id="${id}" aria-pressed="${selected[kind]===id}"`}><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg><span class="tip">${label}</span></button>`;}function render(){[['clear',clear],['pin',pins]].forEach(([kind,items])=>document.querySelector('#'+kind+'-options').innerHTML=items.map(item=>`<div class="choice">${button(kind,item)}<span>${item[0]} · ${item[1]}</span></div>`).join(''));document.querySelector('#pair').innerHTML=button('clear',clear.find(x=>x[0]===selected.clear),true)+button('pin',pins.find(x=>x[0]===selected.pin),true);document.querySelector('#selection').textContent=`Clear ${selected.clear} + Pin ${selected.pin}`;}document.onclick=e=>{const b=e.target.closest('[data-kind]');if(b){selected[b.dataset.kind]=b.dataset.id;render();}};render();
</script></body></html>
