<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali's collection</title>
<script>
try {
  var t = localStorage.getItem("ali-discogs-theme");
  if (t !== "light" && t !== "dark") {
    t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
} catch (e) {}
</script>
<link rel="stylesheet" href="style.css?v=20261113-programme-guard">

</head>
<body>
<a class="skip" href="#shelf">Skip to releases</a>
<header class="app-header"><a class="brand" href="./">Ali’s collection</a><button id="theme" aria-label="Switch theme"><span class="icon-moon">☽</span><span class="icon-sun">☀</span></button></header>
<main class="page-shell">
<section id="collection-view">
<h1>Albums</h1><p id="lede" class="quiet">Loading the collection…</p>
<form id="filters" class="filters">
<label class="search">Search<input id="q" type="search" placeholder="Title, composer, performer" autocomplete="off"></label>
<label>Spotify match<select class="view-select" id="sp"><option value="">All statuses</option><option value="found">Found</option><option value="probable">Probable</option><option value="not_found">Not found</option><option value="pending">Pending</option><option value="unchecked">Unchecked</option></select></label>
<label>Qobuz match<select class="view-select" id="qb"><option value="">All statuses</option></select></label>
<label>Composer<select class="view-select" id="composer"><option value="">Any</option></select></label><label>Label<select class="view-select" id="label"><option value="">Any</option></select></label><label>Genre or style<select class="view-select" id="genre"><option value="">Any</option></select></label><label>Decade<select class="view-select" id="decade"><option value="">Any</option></select></label>
<div class="filter-actions"><label class="frequency-toggle"><input id="frequency" type="checkbox" role="switch" checked><span>Most frequent first</span></label><button id="reset" type="button" disabled>Clear</button></div>
</form>
<p id="showing" class="quiet" aria-live="polite"></p>
<div id="shelf" tabindex="-1" aria-busy="true">Loading albums…</div>
</section>
<section id="detail-view" hidden tabindex="-1"></section>
<p id="notice" class="notice" hidden></p>
<footer><span id="foot"></span><a href="https://www.discogs.com/user/ajozi/collection">ajozi on Discogs</a><a id="sample-link" href="?data=fixture">Sample data</a></footer>
</main>
<noscript>This page needs JavaScript to load the collection.</noscript>
<script src="app.js?v=20261113-programme-guard"></script>
</body></html>
